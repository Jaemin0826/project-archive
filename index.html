<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로젝트 더미</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23e23b3b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="icon-rail" class="icon-rail">
      <button type="button" class="rail-logo" id="btn-rail-logo" title="프로젝트 더미">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="2.5" y="2.5" width="8.2" height="8.2" rx="2"/>
          <rect x="13.3" y="2.5" width="8.2" height="8.2" rx="2"/>
          <rect x="2.5" y="13.3" width="8.2" height="8.2" rx="2"/>
          <rect x="13.3" y="13.3" width="8.2" height="8.2" rx="2" opacity="0.45"/>
        </svg>
      </button>
      <nav class="rail-nav">
        <button type="button" data-rail="home" title="홈">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11L12 4l8 7"/><path d="M6 10.5V20h4.2v-5.5h3.6V20H18V10.5"/></svg>
        </button>
        <button type="button" data-rail="archive" class="is-on" title="내 방송">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="6.5" rx="7" ry="2.6"/><path d="M5 6.5v5.2c0 1.5 3.1 2.7 7 2.7s7-1.2 7-2.7V6.5"/><path d="M5 11.7v5.3c0 1.5 3.1 2.7 7 2.7s7-1.2 7-2.7v-5.3"/></svg>
        </button>
        <button type="button" data-rail="recap" title="RECAP">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 19V11M12 19V6M18 19v-5"/></svg>
        </button>
        <button type="button" data-rail="trash" title="창고">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9.2 7V5.4h5.6V7M8.2 7l.9 12h5.8l.9-12"/></svg>
        </button>
      </nav>
      <button type="button" id="btn-side-expand" class="rail-expand" title="패널 펼치기">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2" width="13" height="12" rx="2"/><path d="M6.2 2v12"/></svg>
      </button>
    </aside>

    <aside id="side-panel" class="side-panel">
      <div class="side-head">
        <h2>내 방송</h2>
        <div class="side-head-actions">
          <button type="button" id="btn-side-new" title="새 프로젝트">+</button>
          <button type="button" id="btn-side-collapse" title="패널 접기">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2" width="13" height="12" rx="2"/><path d="M6.2 2v12"/></svg>
          </button>
        </div>
      </div>
      <div class="side-search">
        <svg class="search-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="side-search" type="search" placeholder="검색..." autocomplete="off" />
      </div>
      <div class="side-seg" role="tablist">
        <button type="button" data-side-mode="category" class="is-on">카테고리</button>
        <button type="button" data-side-mode="status">상태</button>
      </div>
      <div id="side-tree" class="side-tree"></div>
      <div class="side-foot">
        <button type="button" id="btn-add-cat" class="chip-text">+ 카테고리</button>
        <button type="button" id="btn-edit-cats" class="chip-text">편집</button>
      </div>
    </aside>

    <div class="workspace">
      <header class="hud-top">
        <div class="ws-title">
          <button type="button" id="btn-ws-cat" class="ws-cat-btn">
            <span id="ws-cat-label">전체</span>
            <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
          </button>
          <ul id="ws-cat-menu" class="ws-cat-menu" hidden></ul>
        </div>
        <div class="search-box">
          <svg class="search-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="내 방송" autocomplete="off" />
          <ul id="search-results" class="search-results" hidden></ul>
        </div>
        <button type="button" id="btn-menu" class="avatar-btn" title="메뉴">
          <span class="avatar-circle" aria-hidden="true"></span>
          <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
        </button>
      </header>

      <div id="menu-pop" class="menu-pop" hidden>
        <button type="button" id="btn-trash">창고</button>
        <button type="button" id="btn-reset">샘플 데이터로 되돌리기</button>
        <button type="button" id="btn-empty-preview">빈 방 미리보기</button>
        <p class="menu-note">편집은 암호 0000 · 이 기기에 기억됨</p>
      </div>

      <div class="workspace-body">
        <div id="viewport" class="viewport">
          <div id="wall" class="wall"></div>
        </div>

        <div class="hud-br">
          <div class="zoom-btns">
            <button type="button" id="btn-zoom-in" title="확대">+</button>
            <button type="button" id="btn-zoom-out" title="축소">−</button>
            <button type="button" id="btn-home" title="가장 최근 TV로">⌂</button>
          </div>
          <div id="minimap" class="minimap" title="미니맵"></div>
          <button type="button" id="btn-new-project" class="btn-new-project" title="새 프로젝트 만들기">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M7 2.5v9M2.5 7h9"/></svg>
            <span>새 프로젝트</span>
          </button>
        </div>

        <section id="zoom-view" class="overlay zoom-view" hidden>
          <div class="zoom-toolbar">
            <button type="button" id="btn-back-wall" class="hud-btn">← 벽으로</button>
            <div class="zoom-toolbar-r">
              <button type="button" id="btn-onair" class="btn-onair">● ON AIR</button>
              <button type="button" id="btn-complete" class="hud-btn">방송 종료</button>
              <button type="button" id="btn-more-proj" class="hud-btn">···</button>
            </div>
          </div>
          <div id="proj-menu" class="menu-pop proj-menu" hidden>
            <button type="button" id="btn-rename">이름 바꾸기</button>
            <button type="button" id="btn-toggle-private">비공개 전환</button>
            <button type="button" id="btn-delete-proj" class="danger">창고로 보내기</button>
          </div>
          <div class="zoom-stage">
            <div id="big-tv" class="tv tv-big"></div>
            <button type="button" id="btn-prev-file" class="nav-arrow left" aria-label="이전 파일">‹</button>
            <button type="button" id="btn-next-file" class="nav-arrow right" aria-label="다음 파일">›</button>
          </div>
          <div id="zoom-meta" class="zoom-meta"></div>
          <div class="inventory">
            <div class="inv-row">
              <div id="channel-tabs" class="channel-tabs"></div>
              <button type="button" id="btn-shelf" class="chip-text">전체 보기</button>
            </div>
            <div id="vhs-row" class="vhs-row"></div>
            <div id="file-slots" class="file-slots"></div>
          </div>
        </section>

        <section id="recap-view" class="overlay recap-view" hidden>
          <div class="recap-bar">
            <button type="button" id="btn-recap-back" class="hud-btn">← 벽으로</button>
            <div id="recap-tabs" class="recap-tabs">
              <button type="button" data-period="week" class="is-on">주간</button>
              <button type="button" data-period="month">월간</button>
            </div>
          </div>
          <article id="recap-page" class="recap-page"></article>
        </section>
      </div>
    </div>

    <div id="tooltip" class="tooltip" hidden></div>
  </div>

  <section id="onair-view" class="overlay modal-overlay" hidden>
    <div class="modal-backdrop" data-close="onair"></div>
    <form id="onair-form" class="panel onair-panel" autocomplete="off">
      <header class="panel-head">
        <h2>송출</h2>
        <button type="button" class="btn-icon" data-close="onair" aria-label="닫기">×</button>
      </header>
      <div class="onair-grid">
        <label>
          <span>채널</span>
          <select id="oa-channel"></select>
        </label>
        <label class="check-label">
          <input type="checkbox" id="oa-private" />
          <span>이 업데이트 비공개</span>
        </label>
      </div>
      <label>
        <span>제목</span>
        <input id="oa-title" type="text" maxlength="80" placeholder="없어도 돼 · 파일만 있어도 송출돼" />
      </label>
      <label>
        <span>설명</span>
        <textarea id="oa-desc" rows="3" placeholder="진행한 내용, 짧은 메모"></textarea>
      </label>
      <label>
        <span>다음 할 일</span>
        <input id="oa-todo" type="text" maxlength="120" placeholder="다음에 이어서 할 일" />
      </label>
      <div class="mood-field">
        <span>오늘의 기분</span>
        <div id="oa-moods" class="mood-picker"></div>
      </div>
      <div id="oa-drop" class="dropzone">
        <p>파일을 끌어다 놓거나 클릭해서 선택</p>
        <span>이미지 · 영상 · 3D · 파일만 넣어도 송출할 수 있어</span>
        <input id="oa-files" type="file" accept="image/*,video/*,.glb,.gltf,.obj" multiple hidden />
        <div id="oa-previews" class="oa-previews"></div>
      </div>
      <div class="panel-actions">
        <button type="button" class="btn-ghost" data-close="onair">취소</button>
        <button type="submit" class="btn-send">송출!</button>
      </div>
    </form>
  </section>

  <section id="shelf-view" class="overlay modal-overlay" hidden>
    <div class="modal-backdrop" data-close="shelf"></div>
    <div class="panel shelf-panel">
      <header class="panel-head">
        <h2>테이프 선반</h2>
        <button type="button" class="btn-icon" data-close="shelf" aria-label="닫기">×</button>
      </header>
      <div id="shelf-body" class="shelf-body"></div>
    </div>
  </section>

  <section id="trash-view" class="overlay modal-overlay" hidden>
    <div class="modal-backdrop" data-close="trash"></div>
    <div class="panel trash-panel">
      <header class="panel-head">
        <h2>창고</h2>
        <button type="button" class="btn-icon" data-close="trash" aria-label="닫기">×</button>
      </header>
      <p class="panel-lead">삭제한 프로젝트는 30일 동안 여기에 있어.</p>
      <div id="trash-body" class="trash-body"></div>
    </div>
  </section>

  <section id="pass-view" class="overlay modal-overlay" hidden>
    <div class="modal-backdrop" data-close="pass"></div>
    <form id="pass-form" class="panel pass-panel" autocomplete="off">
      <header class="panel-head">
        <h2>편집 암호</h2>
        <button type="button" class="btn-icon" data-close="pass" aria-label="닫기">×</button>
      </header>
      <p class="panel-lead">보는 건 누구나 되고, 편집할 때만 암호가 필요해.</p>
      <label>
        <span>암호</span>
        <input type="text" name="username" value="editor" autocomplete="username" class="visually-hidden" tabindex="-1" aria-hidden="true" />
      <input id="pass-input" type="password" inputmode="numeric" maxlength="16" placeholder="0000" autocomplete="current-password" />
      </label>
      <p id="pass-err" class="pass-err" hidden>암호가 달라...</p>
      <div class="panel-actions">
        <button type="button" class="btn-ghost" data-close="pass">취소</button>
        <button type="submit" class="btn-send">확인</button>
      </div>
    </form>
  </section>

  <section id="cat-view" class="overlay modal-overlay" hidden>
    <div class="modal-backdrop" data-close="cat"></div>
    <form id="cat-form" class="panel pass-panel" autocomplete="off">
      <header class="panel-head">
        <h2>카테고리 추가</h2>
        <button type="button" class="btn-icon" data-close="cat" aria-label="닫기">×</button>
      </header>
      <label>
        <span>이름</span>
        <input id="cat-name" type="text" maxlength="20" placeholder="예: 이미지, 사갈" required />
      </label>
      <div class="panel-actions">
        <button type="button" class="btn-ghost" data-close="cat">취소</button>
        <button type="submit" class="btn-send">추가</button>
      </div>
    </form>
  </section>

  <div id="broadcast-fx" class="broadcast-fx" hidden>
    <div class="fx-static"></div>
    <div class="fx-onair"><span></span> ON AIR</div>
  </div>

  <svg width="0" height="0" aria-hidden="true">
    <filter id="noise-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" />
    </filter>
  </svg>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
